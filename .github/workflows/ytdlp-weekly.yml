name: Weekly yt-dlp check

# Tests the LATEST yt-dlp against the live integration suite every week and
# opens a PR to bump the pin ONLY if every test passes.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-latest-yt-dlp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install current pinned deps, then upgrade yt-dlp to latest
        run: |
          pip install -r requirements.txt
          pip install -U yt-dlp
          pip show yt-dlp | head -2

      - name: Unit tests
        run: pytest tests/ -m "not integration" -q

      - name: Start server
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 &
          sleep 8
          curl -fsS http://127.0.0.1:8000/api/health

      - name: Integration tests against latest yt-dlp
        env:
          TEST_BASE_URL: http://127.0.0.1:8000
        run: pytest tests/ -m integration -v

      - name: Open PR to bump pin (only if tests passed)
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          add-pinned: false
          branch: chore/bump-yt-dlp
          commit-message: "chore: bump yt-dlp to latest (tests passed)"
          title: "chore: bump yt-dlp to latest"
          body: |
            Automated weekly check: the latest `yt-dlp` passed the full unit +
            integration suite (real public links, ffprobe assertions).
            Generated by the `Weekly yt-dlp check` workflow.
          labels: dependencies
